<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أبو عزت TV</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #10131b; color: #f5f7fb; min-height: 100vh; }
    header { display:flex; align-items:center; justify-content:space-between; padding:18px 24px; background:#171c27; border-bottom:1px solid #2a3140; }
    h1 { margin:0; font-size:24px; }
    #status { color:#aab5c7; font-size:14px; }
    main { padding:22px; display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:20px; }
    .player { background:#05070a; border:1px solid #2a3140; border-radius:14px; min-height:420px; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
    video, img { max-width:100%; max-height:70vh; object-fit:contain; }
    audio { max-width:100%; }
    body.playing header { display:none; }
    body.playing main { padding:0; grid-template-columns:1fr; gap:0; }
    body.playing main > section { min-width:0; }
    body.playing aside { display:none; }
    body.playing .player { width:100vw; height:100vh; min-height:100vh; border:0; border-radius:0; }
    body.playing video, body.playing img { width:100%; height:100vh; max-width:100vw; max-height:100vh; object-fit:contain; }
    body.playing #stop { position:fixed; z-index:20; bottom:16px; right:16px; width:auto; min-width:130px; opacity:.88; }
    #placeholder { color:#7e8ba2; text-align:center; padding:20px; }
    aside { background:#171c27; border:1px solid #2a3140; border-radius:14px; padding:18px; }
    .ip { font-size:18px; direction:ltr; text-align:center; margin:12px 0; color:#76e0a0; }
    button { width:100%; padding:12px; margin-top:10px; border:1px solid #394458; background:#222b3a; color:white; border-radius:8px; cursor:pointer; }
    button:focus { outline:3px solid #ffd54a; }
    #message { color:#aab5c7; line-height:1.7; overflow-wrap:anywhere; }
    @media(max-width:850px) { main { grid-template-columns:1fr; } .player { min-height:280px; } }
  </style>
</head>
<body>
  <header>
    <h1>أبو عزت TV</h1>
    <div id="status">جاري تشغيل خدمة الاستقبال…</div>
  </header>
  <main>
    <section>
      <div class="player" id="player">
        <div id="placeholder">افتح أبو عزت كاست واختر هذا الجهاز لإرسال الفيديو أو الصورة</div>
      </div>
      <button id="stop">إيقاف التشغيل</button>
    </section>
    <aside>
      <h2>حالة الريسيفر</h2>
      <div id="ip" class="ip">—</div>
      <p id="message">في انتظار اتصال أبو عزت كاست.</p>
      <p>منفذ الاستقبال: <b>8081</b></p>
      <p>اكتشاف الأجهزة: UDP 37020</p>
    </aside>
  </main>
  <script>
    const player = document.getElementById("player");
    const statusEl = document.getElementById("status");
    const ipEl = document.getElementById("ip");
    const messageEl = document.getElementById("message");
    let currentMedia = null;
    let currentVideo = null;
    let currentAudio = null;

    function releaseMedia(element) {
      if (!element) return;
      try { element.pause(); element.removeAttribute("src"); element.load(); } catch {}
    }

    function stopCurrentPlayback() {
      releaseMedia(currentVideo);
      releaseMedia(currentAudio);
      currentVideo = null;
      currentAudio = null;
      currentMedia = null;
      player.replaceChildren();
    }

    function createAudio(url, hidden = false) {
      const audio = document.createElement("audio");
      audio.src = url;
      audio.autoplay = true;
      audio.preload = "auto";
      audio.controls = !hidden;
      if (hidden) audio.style.display = "none";
      else audio.style.width = "100%";
      player.appendChild(audio);
      currentAudio = audio;
      audio.play().catch(() => {
        messageEl.textContent = "تم استلام الصوت، لكن التشغيل التلقائي تعذر.";
      });
    }

    function showMedia(url, audioUrl) {
      const hasVideo = typeof url === "string" && url.trim() !== "";
      const hasAudio = typeof audioUrl === "string" && audioUrl.trim() !== "";
      if (!hasVideo && !hasAudio) return;

      // An audio-only request can be the companion track arriving after its video.
      if (!hasVideo && hasAudio && currentVideo && !currentVideo.ended) {
        releaseMedia(currentAudio);
        currentAudio = null;
        createAudio(audioUrl, true);
        messageEl.textContent = "تم استلام مسار الصوت الإضافي للفيديو الحالي.";
        return;
      }

      // New video/image/audio-only content replaces and releases old playback.
      stopCurrentPlayback();
      document.body.classList.add("playing");
      currentMedia = url || audioUrl;

      if (hasVideo) {
        const clean = String(url).split("?")[0].toLowerCase();
        if (/\.(jpg|jpeg|png|gif|webp|bmp)$/.test(clean)) {
          const image = document.createElement("img");
          image.src = url;
          image.alt = "المحتوى المستلم";
          player.appendChild(image);
          if (hasAudio) createAudio(audioUrl, true);
          messageEl.textContent = "تم استلام الصورة.";
          return;
        }

        const video = document.createElement("video");
        video.src = url;
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        video.preload = "auto";
        player.appendChild(video);
        currentVideo = video;
        if (hasAudio) createAudio(audioUrl, true);
        video.play().catch(() => {
          messageEl.textContent = "وصل رابط الفيديو، لكن التشغيل التلقائي تعذر أو الصيغة غير مدعومة.";
        });
        messageEl.textContent = hasAudio ? "تم استلام الفيديو والصوت." : "تم استلام الفيديو.";
        return;
      }

      // Audio-only Cast item.
      createAudio(audioUrl, false);
      messageEl.textContent = "تم استلام الصوت.";
    }

    function stopAndReturnHome(message) {
      stopCurrentPlayback();
      document.body.classList.remove("playing");
      player.innerHTML = '<div id="placeholder">افتح أبو عزت كاست واختر هذا الجهاز لإرسال الفيديو أو الصورة</div>';
      messageEl.textContent = message;
    }

    window.aboezzatReceiver.onEvent(event => {
      if (event.type === "server-status") {
        statusEl.textContent = "● خدمة الاستقبال تعمل";
        ipEl.textContent = event.ip + ":" + event.port;
      } else if (event.type === "server-error") {
        statusEl.textContent = "تعذر فتح منفذ الاستقبال";
        messageEl.textContent = event.message + " — قد يكون المنفذ 8081 مستخدمًا بالفعل.";
      } else if (event.type === "play") {
        showMedia(event.url, event.audio);
      } else if (event.type === "command") {
        if (event.command === "stop") {
          stopAndReturnHome("تم إيقاف التشغيل بأمر من أبو عزت كاست.");
        } else if (event.command === "play_pause") {
          const media = player.querySelector("video") || player.querySelector("audio");
          if (media) media.paused ? media.play().catch(() => {}) : media.pause();
        } else if (event.url || event.audio) {
          showMedia(event.url, event.audio);
        }
        messageEl.textContent = "أمر من أبو عزت كاست: " + (event.command || "تشغيل");
      } else if (event.type === "discovery-error") {
        messageEl.textContent = "تعذر تشغيل اكتشاف الأجهزة: " + event.message;
      }
    });

    document.getElementById("stop").addEventListener("click", () => {
      stopAndReturnHome("تم إيقاف التشغيل محليًا.");
    });
  </script>
</body>
</html>
