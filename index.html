<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AboEzzat TV</title>
  <link rel="stylesheet" href="style.css">
  <script src="hls.min.js"></script>
</head>
<body>

  <!-- شاشة الترحيب والمعلومات -->
  <div id="welcome-screen">
    <div class="welcome-box">
      <h1 class="main-title">أهلاً بك يا أبو عزت</h1>
      
      <div class="info-card">
        <div class="info-row">
          <span class="info-label">حالة الاتصال:</span>
          <span id="conn-status" class="status-badge disconnected">غير متصل</span>
        </div>
        <div class="info-row">
          <span class="info-label">عنوان الشاشة (IP):</span>
          <span id="tv-ip" class="info-value">جاري القراءة...</span>
        </div>
        <div class="info-row">
          <span class="info-label">سيرفر الموبايل:</span>
          <span id="server-url" class="info-value">--</span>
        </div>
        <div class="info-row">
          <span class="info-label">الجهاز المتصل:</span>
          <span id="connected-device" class="info-value">لا يوجد</span>
        </div>
      </div>

      <div class="dhikr">
        سبحان الله وبحمده سبحان الله العظيم
      </div>
    </div>
  </div>

  <!-- تنبيه الأوامر السريع (OSD) -->
  <div id="osd-banner" class="osd-hidden">
    <div id="osd-message"></div>
  </div>

  <!-- حاوية الميديا -->
  <div id="media-container">
    <video id="tv-player" playsinline preload="auto"></video>
    <audio id="tv-audio-track" preload="auto"></audio>
    <img id="tv-image" alt="AboEzzat Media" />
  </div>

  <!-- شريط تقدم التشغيل -->
  <div id="player-controls" class="controls-hidden">
    <div class="progress-bar-container">
      <div id="progress-bar"></div>
    </div>
    <div class="time-display">
      <span id="current-time">00:00:00</span> / <span id="total-duration">00:00:00</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
