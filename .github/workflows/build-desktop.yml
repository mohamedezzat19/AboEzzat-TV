name: Build AboEzzat TV Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies (retry transient download failures)
        shell: pwsh
        run: |
          $attempt = 1
          while ($attempt -le 3) {
            npm install
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Write-Host "npm install failed (attempt $attempt). Waiting 20 seconds before retry..."
            Start-Sleep -Seconds 20
            $attempt++
          }
      - name: Build Windows app (retry transient GitHub download failures)
        shell: pwsh
        run: |
          $attempt = 1
          while ($attempt -le 4) {
            npx electron-builder --win nsis
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 4) { exit $LASTEXITCODE }
            Write-Host "electron-builder failed (attempt $attempt). Waiting 30 seconds before retry..."
            Start-Sleep -Seconds 30
            $attempt++
          }
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: aboezzat-tv-windows
          path: desktop/dist/**
          if-no-files-found: error
